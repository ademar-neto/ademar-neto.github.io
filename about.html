<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title">Portfólio - Ademar Ferreira Lima Neto</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header id="header"></header>

  <section id="sobre">
    <h2 data-i18n="about.title">Quem Sou</h2>
    <p data-i18n="about.text">Sou formado em TI, apaixonado por tecnologia...</p>
  </section>

  <footer id="footer"></footer>

  <script>
    async function loadHTML(id, file) {
      let element = document.getElementById(id);
      let response = await fetch(file);
      if (response.ok) {
        element.innerHTML = await response.text();
      } else {
        element.innerHTML = "Erro ao carregar " + file;
      }
    }
    loadHTML("header", "header.html");
    loadHTML("footer", "footer.html");
  </script>
  <script src="js/translate.js"></script>

  
</body>
</html>
