<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-lang="title">Portfólio - Ademar Ferreira Lima Neto</title>
  <link rel="stylesheet" href="style.css">
  <script src="translate.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header id="header"></header>

  <section class="hero">
    <h1 data-lang="hero.title">Bem-vindo ao meu portfólio!</h1>
    <p data-lang="hero.subtitle">Este é o começo do meu site, em breve terá mais conteúdo!</p>
    <a href="#portfolio" class="btn" data-lang="hero.button">Veja meu trabalho</a>
  </section>

  <section id="sobre">
    <h2 data-lang="about.title">Quem Sou</h2>
    <p data-lang="about.text">Sou formado em TI, apaixonado por tecnologia...</p>
  </section>

  <footer id="footer"></footer>

  <script>
    async function loadHTML(id, file) {
      let element = document.getElementById(id);
      let response = await fetch(file);
      if (response.ok) {
        element.innerHTML = await response.text();
      } else {
        element.innerHTML = "Erro ao carregar " + file;
      }
    }
    loadHTML("header", "header.html");
    loadHTML("footer", "footer.html");
  </script>
  
</body>
</html>
